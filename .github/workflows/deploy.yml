name: Deploy Ambition Holidays

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Self-hosted runner on the production VPS — GitHub-hosted ubuntu jobs were stuck queued (no runner assigned).
concurrency:
  group: ambition-holidays-production-deploy-v3
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, Linux, ambition-holidays]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Orbit secrets (optional)
        env:
          ORBIT_PASSKEY: ${{ secrets.ORBIT_PASSKEY }}
          ORBIT_SESSION_SECRET: ${{ secrets.ORBIT_SESSION_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${ORBIT_PASSKEY:-}" ] || [ -z "${ORBIT_SESSION_SECRET:-}" ]; then
            echo "Orbit GitHub secrets not set; skipping sync."
            exit 0
          fi
          CMS_PATH="/var/www/ambition-holidays-cms"
          ORBIT_ENV="${CMS_PATH}/orbit-secrets.env"
          umask 077
          printf 'ORBIT_PASSKEY=%s\nORBIT_SESSION_SECRET=%s\n' "${ORBIT_PASSKEY}" "${ORBIT_SESSION_SECRET}" > "${ORBIT_ENV}"
          chmod 600 "${ORBIT_ENV}"
          mkdir -p /var/www/ambition-holidays/data
          cp "${ORBIT_ENV}" /var/www/ambition-holidays/data/orbit-secrets.env

      - name: Deploy on VPS
        run: bash scripts/deploy-on-vps.sh

      - name: Verify public HTTPS from runner
        run: |
          set -e
          PUBLIC_URL="https://ambition.theglobalorbit.com"
          for i in $(seq 1 12); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "${PUBLIC_URL}/" || true)"
            echo "External HTTPS check ${i}: home=${code}"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            sleep 4
          done
          echo "ERROR: Site not reachable at ${PUBLIC_URL}"
          exit 1

  verify-apple:
    name: Verify live site (Safari/iPhone user agents)
    needs: deploy
    runs-on: [self-hosted, Linux, ambition-holidays]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Safari / iPhone user-agent live checks
        run: |
          set -e
          HOST="https://ambition.theglobalorbit.com"
          UAS=(
            "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_6) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.6 Safari/605.1.15"
            "Mozilla/5.0 (iPhone; CPU iPhone OS 17_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.6 Mobile/15E148 Safari/604.1"
          )
          PATHS=("/" "/orbit-login" "/admin/login" "/api/content")
          for ua in "${UAS[@]}"; do
            for path in "${PATHS[@]}"; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -A "$ua" "${HOST}${path}" || true)"
              echo "UA_CHECK path=${path} code=${code}"
              [ "${code}" = "200" ] || exit 1
            done
          done
          echo "Apple/macOS live verification passed."
